# Configuración del backend de Firebase App Hosting.
# Se lee en cada despliegue; los cambios viajan con el commit.

runConfig:
  # Una comanda se reparte en minutos y luego la mesa se va: no tiene sentido
  # pagar instancias en caliente. El arranque en frío es asumible aquí.
  minInstances: 0
  maxInstances: 3
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # --- Configuración pública de Firebase -----------------------------------
  # Acaba en el bundle del navegador a propósito: sólo permite *leer* comandas,
  # y firestore.rules prohíbe escribir desde el cliente. No es un secreto.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCyPf42j4BKn82uCGPT2R2AasbdXb-m0oA
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: divifriends-2964.firebaseapp.com
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: divifriends-2964
    availability: [ BUILD, RUNTIME ]

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:42731396217:web:14373e26ee2dceddab08a8
    availability: [ BUILD, RUNTIME ]

  # Para el Admin SDK. Las credenciales no hacen falta: App Hosting ejecuta el
  # backend con una cuenta de servicio que ya tiene acceso a Firestore, y
  # applicationDefault() la coge sola.
  - variable: FIREBASE_PROJECT_ID
    value: divifriends-2964
    availability: [ RUNTIME ]

  # --- Medición ---------------------------------------------------------
  # El píxel de Meta. Es un identificador público, va en el HTML de todas
  # formas, así que se escribe aquí y no en Secret Manager.
  #
  # Tiene que estar en BUILD: Next lo incrusta en el bundle al compilar, así
  # que cambiarlo no basta con reiniciar — hay que volver a desplegar.
  #
  # A propósito NO está en `.env.local`: en desarrollo se toca la app cien
  # veces al día y cada toque mandaría un evento falso a este mismo píxel.
  # Vacío en local significa que ni se descarga el script de Facebook.
  # Apagado desde el 18 de agosto de 2026: no hay campañas en marcha, y un
  # píxel encendido «por si acaso» obliga a pedir consentimiento, a mantener un
  # cartel de cookies y a explicarlo en la política, todo para no medir nada.
  #
  # Volver a encenderlo es descomentar estas dos líneas y desplegar. El código
  # se queda entero: sin esta variable no se descarga ni una línea de Facebook,
  # el cartel no aparece y las páginas de cookies y privacidad se ajustan solas.
  # - variable: NEXT_PUBLIC_META_PIXEL_ID
  #   value: "1054021497541259"
  #   availability: [BUILD, RUNTIME]

  # La llave de /metricas. Va en Secret Manager y no aquí, así que este bloque
  # está comentado a propósito: descoméntalo DESPUÉS de crear el secreto, o el
  # despliegue falla por no encontrarlo.
  #   firebase apphosting:secrets:set metricas-token --project divifriends-2964
  # - variable: METRICAS_TOKEN
  #   secret: metricas-token
  #   availability: [RUNTIME]

  # --- Lectura de tickets ---------------------------------------------------
  # Qué modelo lee la foto del ticket: `gemini` o `anthropic`. Es la única
  # variable de coste que crece con los usuarios, así que se elige por
  # configuración: volverse a Claude es cambiar esta línea y desplegar, sin
  # tocar una sola línea de código.
  #
  # Qué modelo concreto lee está en `TARIFAS` de `lib/ocr.ts`. Desde el 27 de
  # agosto de 2026 es Gemini 3.1 Flash Lite: el anterior tardaba más de un
  # minuto por ticket y dejaba la app inservible. Si algún día vuelve a ir
  # lenta, el log escupe una línea con la palabra LENTA.
  - variable: OCR_MODELO
    value: gemini
    availability: [RUNTIME]

  # --- Secretos -------------------------------------------------------------
  # Viven en Secret Manager, nunca en el repo. Sólo en RUNTIME: las claves no
  # deben quedar incrustadas en el bundle compilado, que es público.
  - variable: ANTHROPIC_API_KEY
    secret: anthropic-api-key
    availability: [RUNTIME]

  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability: [RUNTIME]
